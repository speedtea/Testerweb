<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

<section class="py-12 bg-[#f8f1ed] dark:bg-black">
    <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-2xl font-semibold mb-8 text-gray-900 dark:text-white">Recent Products</h2>
        
        <div class="swiper myProductSwiper">
            <div class="swiper-wrapper">
                
                <div class="swiper-slide bg-white dark:bg-zinc-900 p-4 rounded-xl">
                    <div class="relative group">
                        <img src="URL_FOTO_TAS_1.jpg" class="w-full aspect-[4/5] object-cover rounded-lg" alt="Product">
                        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="bg-white p-2 rounded-full shadow-md">🛒</button>
                            <button class="bg-white p-2 rounded-full shadow-md">👁️</button>
                        </div>
                    </div>
                    <div class="mt-4 text-center">
                        <h3 class="text-sm font-medium text-gray-800 dark:text-gray-200">BeYou Hera Backpack</h3>
                        <p class="text-lg font-bold mt-1 text-gray-900 dark:text-white">Rp 550.000</p>
                        <div class="flex justify-center gap-1 mt-2">
                            <span class="w-3 h-3 rounded-full bg-red-700"></span>
                            <span class="w-3 h-3 rounded-full bg-brown-900"></span>
                            <span class="w-3 h-3 rounded-full bg-black"></span>
                        </div>
                    </div>
                </div>

                <div class="swiper-slide bg-white dark:bg-zinc-900 p-4 rounded-xl">
                    <div class="relative group">
                        <img src="URL_FOTO_TAS_2.jpg" class="w-full aspect-[4/5] object-cover rounded-lg" alt="Product">
                        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="bg-white p-2 rounded-full shadow-md">🛒</button>
                            <button class="bg-white p-2 rounded-full shadow-md">👁️</button>
                        </div>
                    </div>
                    <div class="mt-4 text-center">
                        <h3 class="text-sm font-medium text-gray-800 dark:text-gray-200">Clutch Zain Hand Bag</h3>
                        <p class="text-lg font-bold mt-1 text-gray-900 dark:text-white">Rp 690.000</p>
                        <div class="flex justify-center gap-1 mt-2">
                            <span class="w-3 h-3 rounded-full bg-orange-800"></span>
                            <span class="w-3 h-3 rounded-full bg-black"></span>
                        </div>
                    </div>
                </div>

                </div>
            <div class="swiper-pagination !static mt-8"></div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  var swiper = new Swiper(".myProductSwiper", {
    slidesPerView: 2, // Muncul 2 di HP
    spaceBetween: 20,
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
    },
    breakpoints: {
      640: { slidesPerView: 2 },
      1024: { slidesPerView: 4 }, // Muncul 4 di Laptop
    },
  });
</script>
