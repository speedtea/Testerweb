<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IQL Premium | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:italic,wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { iql: { brown: '#4a3728', cream: '#f8f1ed' } },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .smooth-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .active-nav { color: #4a3728; opacity: 1 !important; transform: translateY(-5px); }
        .dark .active-nav { color: #f8f1ed; }
        .heart-active { color: #ef4444 !important; transform: scale(1.2); }
    </style>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased text-black">

    <nav class="fixed top-0 w-full z-50 bg-white/90 dark:bg-black/90 backdrop-blur-md border-b border-zinc-100 dark:border-zinc-800">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <h1 class="font-serif text-2xl italic tracking-tighter cursor-pointer text-black dark:text-white" onclick="window.scrollTo(0,0)">IQL.</h1>
            <button onclick="toggleTheme()" class="p-2 rounded-full bg-zinc-100 dark:bg-zinc-800">🌙</button>
        </div>
    </nav>

    <section id="home" class="mt-16 relative h-[45vh] md:h-[70vh] overflow-hidden">
        <div id="hero-slider" class="flex h-full transition-transform duration-1000 ease-in-out">
            <div class="min-w-full bg-cover bg-center" style="background-image: url('LINK_FOTO_KAMU_1')"></div>
            <div class="min-w-full bg-cover bg-center" style="background-image: url('LINK_FOTO_KAMU_2')"></div>
            <div class="min-w-full bg-cover bg-center" style="background-image: url('LINK_FOTO_KAMU_3')"></div>
        </div>
    </section>

    <section class="py-10 bg-zinc-50 dark:bg-zinc-900/30">
        <div class="max-w-7xl mx-auto px-6 grid grid-cols-3 gap-4 text-center">
            <a href="#recent" class="group">
                <div class="aspect-square bg-white dark:bg-zinc-800 rounded-2xl flex items-center justify-center text-2xl mb-2 shadow-sm group-hover:scale-110 smooth-transition">🔥</div>
                <span class="text-[10px] font-bold uppercase tracking-widest">Hits</span>
            </a>
            <a href="#collections" class="group">
                <div class="aspect-square bg-white dark:bg-zinc-800 rounded-2xl flex items-center justify-center text-2xl mb-2 shadow-sm group-hover:scale-110 smooth-transition">👜</div>
                <span class="text-[10px] font-bold uppercase tracking-widest">Style</span>
            </a>
            <a href="#instagram-feed" class="group">
                <div class="aspect-square bg-white dark:bg-zinc-800 rounded-2xl flex items-center justify-center text-2xl mb-2 shadow-sm group-hover:scale-110 smooth-transition">✨</div>
                <span class="text-[10px] font-bold uppercase tracking-widest">Recom</span>
            </a>
        </div>
    </section>

    <section id="recent" class="py-12">
        <div class="max-w-7xl mx-auto px-6">
            <h3 class="text-2xl font-semibold mb-8">Recent Products</h3>
            <div id="grid-recent" class="flex gap-4 overflow-x-auto no-scrollbar snap-x">
                <div class="min-w-[220px] snap-start relative group">
                    <button onclick="toggleLove(this)" class="absolute top-3 right-3 z-20 bg-white/80 backdrop-blur-sm p-2 rounded-full shadow-md smooth-transition">❤️</button>
                    <div onclick="openPop('Hera Backpack', '550.000', 'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=500')" class="cursor-pointer">
                        <div class="relative overflow-hidden rounded-2xl mb-3">
                            <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=500" class="aspect-[4/5] object-cover group-hover:scale-110 smooth-transition">
                        </div>
                        <h4 class="text-sm font-medium">Hera Backpack</h4>
                        <p class="text-xs opacity-60">Rp 550.000</p>
                    </div>
                </div>
                </div>
        </div>
    </section>

    <section id="collections" class="py-12 border-t dark:border-zinc-800 bg-zinc-50 dark:bg-transparent text-black">
        <div class="max-w-7xl mx-auto px-6">
            <h3 class="text-2xl font-semibold mb-8 dark:text-white">Our Collections</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <script>
                    const collectionItems = [
                        {name: 'Zain Hand Bag', price: '690.000', img: 'https://images.unsplash.com/photo-1594223274512-ad4803739b7c?auto=format&fit=crop&w=500'},
                        // Tambahkan sampai 12 produk di sini...
                    ];
                    collectionItems.forEach(p => {
                        document.write(`
                            <div class="group relative bg-white dark:bg-zinc-900 p-2 rounded-2xl shadow-sm">
                                <button onclick="toggleLove(this)" class="absolute top-4 right-4 z-20 bg-white/80 p-1.5 rounded-full shadow-sm text-xs">❤️</button>
                                <div onclick="openPop('${p.name}', '${p.price}', '${p.img}')" class="cursor-pointer">
                                    <div class="relative overflow-hidden rounded-xl mb-3">
                                        <img src="${p.img}" class="aspect-square object-cover group-hover:scale-105 smooth-transition">
                                    </div>
                                    <h4 class="text-[11px] font-bold uppercase dark:text-white">${p.name}</h4>
                                    <p class="text-[10px] opacity-50 dark:text-zinc-400">Rp ${p.price}</p>
                                </div>
                            </div>
                        `);
                    });
                </script>
            </div>
        </div>
    </section>

    <section id="instagram-feed" class="py-20 bg-white dark:bg-black border-t dark:border-zinc-800">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <h3 class="font-serif italic text-3xl mb-12 dark:text-white">@iqbalmaulanas_</h3>
            <div class="elfsight-app-cbef7085-0d14-4bdf-b0ee-e34ce8e965cf" data-elfsight-app-lazy></div>
        </div>
    </section>

    <div id="pop" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] hidden flex items-center justify-center p-6">
        <div class="bg-white dark:bg-zinc-900 w-full max-w-sm rounded-[40px] p-8 text-center shadow-2xl">
            <img id="pop-img" src="" class="w-full aspect-square object-cover rounded-3xl mb-6 shadow-xl">
            <h3 id="pop-t" class="text-xl font-bold dark:text-white"></h3>
            <p id="pop-p" class="text-zinc-500 text-sm mb-8"></p>
            <div class="flex flex-col gap-3">
                <a id="shopee-link" href="#" target="_blank" class="bg-[#ee4d2d] text-white py-4 rounded-2xl font-bold text-sm">Shopee</a>
                <a id="wa-link" href="#" target="_blank" class="bg-[#25d366] text-white py-4 rounded-2xl font-bold text-sm">WhatsApp</a>
                <button onclick="closePop()" class="mt-4 text-[10px] font-bold opacity-30 uppercase dark:text-white">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        // Hero Slider
        let s = 0; setInterval(() => { s = (s+1)%3; document.getElementById('hero-slider').style.transform=`translateX(-${s*100}%)`; }, 5000);

        // Theme & Navigation
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark')?'dark':'light');
        }
        function toggleLove(btn) { btn.classList.toggle('heart-active'); }

        function openPop(t, p, i) {
            document.getElementById('pop-t').innerText = t;
            document.getElementById('pop-p').innerText = 'Rp ' + p;
            document.getElementById('pop-img').src = i;
            document.getElementById('pop').classList.remove('hidden');
        }
        function closePop() { document.getElementById('pop').classList.add('hidden'); }
    </script>
    <script src="https://elfsightcdn.com/platform.js" async></script>
</body>
    </html>
